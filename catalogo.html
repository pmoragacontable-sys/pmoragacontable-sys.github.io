<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo</title>
<style>
:root{--bg:#f6f5f1;--pan:#fff;--ink:#1d2421;--mut:#5f6b66;--lin:#dcdcd4;--acc:#b8361e;--ok:#2f7d4f;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#161a18;--pan:#1f2422;--ink:#ecefe9;--mut:#a3ada7;--lin:#36403b;--acc:#e0603f;--ok:#5fbf86;--warn:#e0a03a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--lin);background:var(--pan)}header img{max-height:54px;max-width:120px}h1{margin:0;font-size:22px}.sub{color:var(--mut);font-size:13px;margin:2px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px}.bar input,.bar select{min-height:42px;padding:8px 12px;border:1px solid var(--lin);border-radius:10px;background:var(--pan);color:var(--ink);font:inherit}.bar input{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:0 20px 30px}
.card{background:var(--pan);border:1px solid var(--lin);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.ph{aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:40px}.ph img{width:100%;height:100%;object-fit:cover}
.bd{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}.cat{color:var(--mut);font-size:12px}.nom{font-weight:700}.det{color:var(--mut);font-size:13px}.pre{font-size:18px;font-weight:700;margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;width:max-content}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--acc)}
.ctrl{font-size:11px;color:var(--mut)}a.btn{margin-top:auto;display:block;text-align:center;padding:10px;border-radius:10px;background:#25D366;color:#fff;font-weight:700;text-decoration:none}
.msg{padding:30px 20px;color:var(--mut)}footer{padding:16px 20px;color:var(--mut);font-size:12px;border-top:1px solid var(--lin)}
</style></head><body>
<header><img id="logo" alt="" hidden><div><h1 id="nom">Catálogo</h1><p class="sub" id="sub"></p></div></header>
<div class="bar"><input id="q" placeholder="Buscar producto, marca o calibre"><select id="fc"><option value="">Todas las categorías</option></select></div>
<div class="grid" id="g"></div><p class="msg" id="msg">Cargando catálogo…</p><footer id="pie"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{const SUPA={url:'https://rtvedgrgqoamrmvqwayh.supabase.co',key:'sb_publishable_ArR2hcpJtuLqBZFt2wfqTQ_-TwvnM8b'};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=n=>Math.round(+n||0).toLocaleString('es-CL'),norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let D=null;
function pintar(){const q=norm($('q').value),fc=$('fc').value,C=D.cfg||{},w=String(C.wsp||C.fono||'').replace(/\D/g,''),wn=w.length===9?'56'+w:w;
  const L=(D.items||[]).filter(x=>(!fc||x.cat===fc)&&(!q||norm([x.nom,x.mar,x.mod,x.cal,x.cat].join(' ')).includes(q)));
  $('g').innerHTML=L.map(x=>{const cl=x.disp==='Disponible'?'ok':x.disp==='Agotado'?'bad':'warn',det=[x.mar,x.mod,x.cal&&('cal. '+x.cal),x.uni,x.origen,x.estado].filter(Boolean).join(' · ');
    return '<div class="card"><div class="ph">'+(x.foto?'<img src="'+x.foto+'" alt="'+esc(x.nom)+'" loading="lazy">':'📦')+'</div><div class="bd"><span class="cat">'+esc(x.cat)+'</span><span class="nom">'+esc(x.nom)+'</span>'+(det?'<span class="det">'+esc(det)+'</span>':'')+(x.desc?'<span class="det">'+esc(x.desc)+'</span>':'')+(x.precio!=null&&x.precio?'<span class="pre">$'+fmt(x.precio)+'</span>':'')+'<span class="tag '+cl+'">'+esc(x.disp)+'</span>'+(x.ctrl?'<span class="ctrl">Venta sujeta a autorización de la autoridad fiscalizadora (Ley 17.798).</span>':'')+(x.edad?'<span class="ctrl">Venta solo a mayores de 18 años.</span>':'')+(wn?'<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+wn+'?text='+encodeURIComponent('Hola, quiero consultar por: '+x.nom)+'">Consultar por WhatsApp</a>':'')+'</div></div>'}).join('');
  $('msg').textContent=L.length?'':'No hay productos que coincidan.'}
(async()=>{const c=new URLSearchParams(location.search).get('c');if(!c){$('msg').textContent='Falta el nombre del catálogo en el enlace.';return}
  try{const sb=window.supabase.createClient(SUPA.url,SUPA.key),{data,error}=await sb.from('catalogo_pub').select('data').eq('slug',c).maybeSingle();if(error)throw error;if(!data){$('msg').textContent='Este catálogo no existe o fue retirado.';return}D=data.data;
    const C=D.cfg||{};$('nom').textContent=C.nombre||'Catálogo';document.title=(C.nombre||'Catálogo')+' · Catálogo';$('sub').textContent=[C.dom,C.comuna,C.fono].filter(Boolean).join(' · ');if(C.logo){$('logo').src=C.logo;$('logo').hidden=false}
    [...new Set((D.items||[]).map(x=>x.cat))].sort().forEach(k=>{const o=document.createElement('option');o.textContent=k;$('fc').append(o)});
    $('pie').textContent='Disponibilidad actualizada el '+new Date(D.fecha).toLocaleString('es-CL')+'. Precios con IVA incluido. Las armas y municiones se venden solo con la autorización de la autoridad fiscalizadora.';pintar()}
  catch(e){$('msg').textContent='No se pudo cargar el catálogo.'}})();
$('q').addEventListener('input',()=>D&&pintar());$('fc').addEventListener('change',()=>D&&pintar());
})();
</script></body></html>
